# /etc/nginx/sites-available/relu-website.conf
#
# Serves /_next/static and public/ directly, proxies everything else to the
# Next.js standalone server on 127.0.0.1:3000 (plain HTTP; Cloudflare
# terminates TLS in front of this box).
#
# Phase 1 (no DNS yet): match on the VPS IP / any host. The server_name is "_"
# so `verify.sh` against http://127.0.0.1 and later against the real hostname
# both land here.
# Phase 2 (DNS + Cloudflare): change server_name to the real domain and keep
# the rest identical. TLS is added at Cloudflare; see deploy/vps/DEPLOY.md
# ("After DNS") for the optional origin-certificate listener.

upstream relu_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

# X-Forwarded-Proto: forward what Cloudflare tells us; if the header is absent
# (direct hit on the VPS during pre-DNS verification) fall back to http.
map $http_x_forwarded_proto $upstream_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;

    server_name _;

    # One-line override once the domain exists: server_name relu.example.org;

    ############################################
    # Static assets served by nginx
    ############################################

    # Immutable build output. Must never 404 as text/plain: the app resolves
    # these URLs, and nginx guarantees the right MIME type via mime.types.
    location ^~ /_next/static/ {
        alias /opt/relu-website/current/standalone/.next/static/;
        include /etc/nginx/mime.types;
        default_type application/javascript;

        # Next fingerprints these per build, so they are safe to cache hard.
        expires 1y;
        add_header Cache-Control "public, immutable";

        access_log off;
    }

    # Files from the repo's public/ directory (avatars, images, ...).
    location / {
        root /opt/relu-website/current/standalone/public;
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # Serve existing public files directly, everything else to Next.
        try_files $uri @next;

        expires 1h;
        add_header Cache-Control "public";
    }

    ############################################
    # Health/readiness
    ############################################

    # Proxied healthcheck: proves the full chain (nginx -> Node -> Next).
    # A monitor can bind its alert to this single URL.
    location = /api/health {
        proxy_pass http://relu_next;
        include /etc/nginx/proxy_params_relu.conf;
        access_log off;
    }

    ############################################
    # Proxy everything else to Next
    ############################################

    location @next {
        include /etc/nginx/proxy_params_relu.conf;
    }

    #
    # trust Cloudflare for client IP: /etc/nginx/conf.d/cloudflare-ips.conf
    # does set_real_ip_from <every Cloudflare range> and
    # real_ip_header CF-Connecting-IP; real_ip_recursive on;
    # With that in place $remote_addr is the real visitor IP, which is what
    # the app logs and any rate limiting should see.
    #

    ############################################
    # Optional: origin TLS after Cloudflare goes live
    ############################################
    # Create a Cloudflare Origin Certificate, then un-comment:
    #
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/ssl/certs/relu-website-origin.pem;
    # ssl_certificate_key /etc/ssl/private/relu-website-origin.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # - set Cloudflare SSL mode to "Full (strict)".
    # Keep the listen 80 line only if you also want to catch plain requests
    # to the IP; otherwise remove it once the origin cert is live.
}
