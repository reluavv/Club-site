# /etc/nginx/snippets/proxy_params_relu.conf
# Included by every proxied location in relu-website.conf.

proxy_pass http://relu_next;
proxy_http_version 1.1;

# keepalive to the Node server
proxy_set_header Connection "";

# Forward the host the visitor used, so Next builds correct URLs.
proxy_set_header Host $host;

# Real client IP (real_ip module has already rewritten $remote_addr from
# CF-Connecting-IP) and the original scheme (https behind Cloudflare).
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $upstream_proto;

proxy_redirect off;
proxy_buffering on;
proxy_buffers 16 16k;
proxy_buffer_size 32k;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
proxy_connect_timeout 5s;
