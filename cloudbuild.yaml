# Dockerfile build with Cloud Build for GCP Cloud Run
steps:
  # Build the container image
  - name: gcr.io/cloud-builders/docker
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/relu-website'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=$_NEXT_PUBLIC_FIREBASE_API_KEY'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=$_NEXT_PUBLIC_FIREBASE_PROJECT_ID'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_APP_ID=$_NEXT_PUBLIC_FIREBASE_APP_ID'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIRESTORE_DATABASE_ID=$_NEXT_PUBLIC_FIRESTORE_DATABASE_ID'
      - '.'

  # Push to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/relu-website'

  # Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'relu-website-service'
      - '--image'
      - 'gcr.io/$PROJECT_ID/relu-website'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'

      # Add/update runtime variables without removing existing ones
      - '--update-env-vars'
      - 'CLUB_TIMEZONE=$_CLUB_TIMEZONE,EMAIL_USER=$_EMAIL_USER,B2_S3_ENDPOINT=$_B2_S3_ENDPOINT,B2_REGION=$_B2_REGION,B2_BUCKET_NAME=$_B2_BUCKET_NAME,FIRESTORE_DATABASE_ID=$_FIRESTORE_DATABASE_ID'

      # Add/update secrets without removing existing secret mappings
      - '--update-secrets'
      - 'EMAIL_PASS=email-pass:latest,FIREBASE_ADMIN_KEY=firebase-admin-key:latest,B2_APPLICATION_KEY_ID=b2-application-key-id:latest,B2_APPLICATION_KEY=b2-application-key:latest'

      # AUTOMATIC BIRTHDAY MAIL on Cloud Run (optional, documented but OFF
      # until you follow these three steps — do not uncomment early, a missing
      # Secret Manager secret fails the deploy itself):
      #   1. Create the secret once (same value the scheduler will send):
      #        gcloud secrets create cron-secret --data-file=<(openssl rand -hex 32)
      #   2. Append to --update-secrets above:  ,CRON_SECRET=cron-secret:latest
      #   3. Point Cloud Scheduler (or any cron) at the deployed URL:
      #        POST https://<cloud-run-domain>/api/cron/birthdays
      #        Authorization: Bearer <that same generated value>
      # Leave OFF to keep scheduled mail disabled — the route answers 503 and
      # the CTO can still send manually from the admin dashboard.

images:
  - 'gcr.io/$PROJECT_ID/relu-website'

substitutions:
  # Firebase values embedded into the browser bundle during the Docker build
  _NEXT_PUBLIC_FIRESTORE_DATABASE_ID: '(default)'

  # Cloud Run runtime environment variables
  _FIRESTORE_DATABASE_ID: '(default)'
  _CLUB_TIMEZONE: 'Asia/Kolkata'
  _EMAIL_USER: 'reluavv@gmail.com'
  _B2_S3_ENDPOINT: 'https://s3.eu-central-003.backblazeb2.com'
  _B2_REGION: 'eu-central-003'
  _B2_BUCKET_NAME: 'reluwebsite'

options:
  logging: CLOUD_LOGGING_ONLY