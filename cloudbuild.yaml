# Dockerfile build with Cloud Build for GCP Cloud Run
steps:
  # Build the container image
  - name: gcr.io/cloud-builders/docker
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/relu-website'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=$_NEXT_PUBLIC_FIREBASE_API_KEY'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=$_NEXT_PUBLIC_FIREBASE_PROJECT_ID'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_APP_ID=$_NEXT_PUBLIC_FIREBASE_APP_ID'
      - '.'

  # Push to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args: ['push', 'gcr.io/$PROJECT_ID/relu-website']

  # Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'relu-website-service'
      - '--image'
      - 'gcr.io/$PROJECT_ID/relu-website'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--set-env-vars'
      - 'EMAIL_USER=$_EMAIL_USER'
      # Gmail app password lives in Secret Manager, not env vars
      - '--set-secrets'
      - 'EMAIL_PASS=email-pass:latest'
      # Runtime Firebase Admin SDK credentials (base64-encoded service-account)
      - '--set-secrets'
      - 'FIREBASE_ADMIN_KEY=firebase-admin-key:latest'

images:
  - 'gcr.io/$PROJECT_ID/relu-website'

options:
  logging: CLOUD_LOGGING_ONLY
